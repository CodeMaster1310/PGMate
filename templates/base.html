<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Dashboard{% endblock %} | PGMate</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header class="topbar"><a class="brand" href="{{ url_for('dashboard') }}"><span class="brand-icon">P</span><span>PGMate<small>SMART PG MANAGER</small></span></a><nav><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('members_page') }}">Members</a><a href="{{ url_for('expenses_page') }}">Expenses</a><a href="{{ url_for('split_page') }}">Split</a><a href="{{ url_for('complaints_page') }}">Complaints</a><a href="{{ url_for('reports') }}">Reports</a></nav></header><main class="wrap">{% with messages=get_flashed_messages(with_categories=true) %}{% for kind,msg in messages %}<div class="flash {{ kind }}">{{ msg }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>PGMate · Python Flask + JSON files · {{ year }}</footer></body></html>
